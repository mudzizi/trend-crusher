# TrendCrusher Configuration Example (v13.8.7)
# Copy this file to config.yaml and update your settings.

# --- VERSION ---
VERSION: "13.8.7"

# --- API KEYS ---
# OVERRIDE: Environment variables will override these values if they exist.
# Default hash for 'admin' (werkzeug default)
DASHBOARD_PASSWORD_HASH: "scrypt:32768:8:1$7f5mNqE5I8J2X4G1$d6499808945695027589d81395804369e80a0680650954084569850243690"
EXCHANGE: "binance"
BINANCE_API_KEY: "YOUR_BINANCE_API_KEY"
BINANCE_SECRET: "YOUR_BINANCE_SECRET"
TELEGRAM_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN"
TELEGRAM_CHAT_ID: "YOUR_TELEGRAM_CHAT_ID"

# --- OPERATIONAL SETTINGS ---
DRY_RUN: true
SEED: 10000.0
SYMBOLS_LIST:
  - "BTC/USDT"
  - "ETH/USDT"
  - "TRUMP/USDT"
  - "SOL/USDT"
MAX_CONCURRENT_TRADES: 3
MARGIN_MODE: "ISOLATED"
MAX_LEVERAGE: 5
# Maximum total position value (including pending orders) in USDT for a single symbol
MAX_POSITION_VALUE_USDT: 1000.0

# --- GLOBAL MODE DEFAULTS ---
# These apply to all symbols unless overridden in SYMBOL_SETTINGS.
USE_SNIPER: true          # Pre-emptive Limit Entry (Maker)
USE_RETEST_MAKER: false   # Post-breakout Pullback Entry (Maker)
# If both are false, the bot uses Market Entry (Taker) on signal close.

# --- GLOBAL STRATEGY PARAMETERS ---
VOL_MULTIPLIER: 2.0      
TRAILING_ATR_MULT: 4.5   
RISK_PER_TRADE: 0.02     
EMA_TREND_PERIOD: 100
DONCHIAN_PERIOD: 20
ATR_PERIOD: 14
AVG_VOL_PERIOD: 20
INITIAL_SL_ATR: 2.0
ADX_FILTER_LEVEL: 15
SNIPER_PROXIMITY_PCT: 0.005 # 0.5% proximity to trigger Sniper ambush

# --- SYMBOL SPECIFIC OVERRIDES (RECOMMENDED DEFAULTS) ---
# You can customize ANY parameter for specific coins here.
# These values are based on 1-year historical backtest optimizations.
SYMBOL_SETTINGS:
  "BTC/USDT":
    USE_SNIPER: true
    USE_RETEST_MAKER: false
    ALLOCATED_SEED: 100.0
    RISK_PER_TRADE: 0.02
    VOL_MULTIPLIER: 1.4
    EMA_TREND_PERIOD: 50
    TRAILING_ATR_MULT: 3.5
    ADX_FILTER_LEVEL: 9
    ADX_4H_THRESHOLD: 24
    CHAOS_THRESHOLD: 24.0
    DONCHIAN_PERIOD: 10
    BE_GUARD_THRESHOLD: 5.0
  
  "ETH/USDT":
    USE_SNIPER: false
    USE_RETEST_MAKER: false
    ALLOCATED_SEED: 100.0
    RISK_PER_TRADE: 0.02
    VOL_MULTIPLIER: 1.2
    EMA_TREND_PERIOD: 100
    TRAILING_ATR_MULT: 3.9
    ADX_FILTER_LEVEL: 7
    ADX_4H_THRESHOLD: 22
    CHAOS_THRESHOLD: 15.0
    DONCHIAN_PERIOD: 10
    BE_GUARD_THRESHOLD: 5.0
  
  "SOL/USDT":
    USE_SNIPER: true
    USE_RETEST_MAKER: false
    ALLOCATED_SEED: 100.0
    VOL_MULTIPLIER: 2.5    # Requires stronger momentum
    ADX_FILTER_LEVEL: 20   # Filter out choppy SOL movements
    TRAILING_ATR_MULT: 4.5
  
  "XRP/USDT":
    USE_SNIPER: false
    USE_RETEST_MAKER: false
    ALLOCATED_SEED: 100.0
    RISK_PER_TRADE: 0.02
    VOL_MULTIPLIER: 2.2
    EMA_TREND_PERIOD: 50
    TRAILING_ATR_MULT: 5.2
    ADX_FILTER_LEVEL: 24
    ADX_4H_THRESHOLD: 6
    CHAOS_THRESHOLD: 10.0
    DONCHIAN_PERIOD: 10
    BE_GUARD_THRESHOLD: 3.0
  
  "TRUMP/USDT":
    USE_SNIPER: false
    USE_RETEST_MAKER: false
    ALLOCATED_SEED: 100.0
    RISK_PER_TRADE: 0.02
    VOL_MULTIPLIER: 0.9
    EMA_TREND_PERIOD: 50
    TRAILING_ATR_MULT: 3.6
    ADX_FILTER_LEVEL: 22
    ADX_4H_THRESHOLD: 11
    CHAOS_THRESHOLD: 9.0
    DONCHIAN_PERIOD: 20
    BE_GUARD_THRESHOLD: 2.0
  
  "XAU/USDT":
    USE_SNIPER: true
    USE_RETEST_MAKER: false
    ALLOCATED_SEED: 10000.0
    VOL_MULTIPLIER: 2.5
    EMA_TREND_PERIOD: 200  # Gold is highly trend-dependent
    ADX_FILTER_LEVEL: 30   # Only enter Gold on massive breakouts

# --- ADAPTIVE TRAILING STOP ---
USE_ADAPTIVE_TRAIL: true
ADAPTIVE_TRAIL_STEPS:
  - pnl_pct: 15.0
    tighten_ratio: 0.6
  - pnl_pct: 30.0
    tighten_ratio: 0.3

# --- MISC ---
SIGNAL_TIMEFRAME: "1h"
TREND_TIMEFRAME: "4h"
CHECK_TIMEFRAME: "1m"
DATA_DIR: "data"
